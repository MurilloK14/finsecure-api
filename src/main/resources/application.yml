spring:
  application:
    name: finsecure-api
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finsecure_db}
    username: ${SPRING_DATASOURCE_USERNAME:finsecure_user}
    password: ${SPRING_DATASOURCE_PASSWORD:finsecure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # O Flyway quem comanda as tabelas, não o Hibernate!
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:finsecure_user}
    password: ${SPRING_RABBITMQ_PASSWORD:finsecure_password}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms

server:
  port: 8080

security:
  jwt:
    # Chave secreta de 256 bits em hexadecimal (obrigatória via variável JWT_SECRET ou arquivo .env)
    secret-key: ${JWT_SECRET}
    # Tempo de expiração do token em milissegundos: 86400000 ms = 24 horas (24 * 60 * 60 * 1000)
    expiration-time: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: finsecure-api