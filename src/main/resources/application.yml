spring:
  application:
    name: finsecure-api
  datasource:
    url: jdbc:postgresql://localhost:5432/finsecure_db
    username: finsecure_user
    password: finsecure_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # O Flyway quem comanda as tabelas, não o Hibernate!
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: finsecure_user
    password: finsecure_password
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms

server:
  port: 8080

security:
  jwt:
    # Chave secreta de 256 bits em hexadecimal (usada para assinar o HMAC-SHA256)
    secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    # Tempo de expiração do token em milissegundos: 86400000 ms = 24 horas (24 * 60 * 60 * 1000)
    expiration-time: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: finsecure-api