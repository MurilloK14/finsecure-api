services:
  postgres:
    image: postgres:17-alpine
    container_name: finsecure-postgres
    restart: always
    environment:
      POSTGRES_DB: finsecure_db
      POSTGRES_USER: finsecure_user
      POSTGRES_PASSWORD: finsecure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: finsecure-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: finsecure_user
      RABBITMQ_DEFAULT_PASS: finsecure_password
    ports:
      - "5672:5672"    # Porta do protocolo AMQP (Spring Boot)
      - "15672:15672"  # Porta do painel Web de Gerenciamento
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsecure-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finsecure_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis

    depends_on:
      - postgres
      - rabbitmq
      - redis


  prometheus:
    image: prom/prometheus:latest
    container_name: finsecure-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: finsecure-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: finsecure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
  redis_data:
